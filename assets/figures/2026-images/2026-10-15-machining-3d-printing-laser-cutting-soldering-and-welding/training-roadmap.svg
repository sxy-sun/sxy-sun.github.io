<svg xmlns="http://www.w3.org/2000/svg" width="1380" height="1000" viewBox="0 0 1380 1000" role="img" aria-labelledby="title desc">
<title id="title">My workshop training roadmap</title>
<desc id="desc">Basics I on Canvas leads to Wilson Basics II and FRB Basics II. Wilson Basics II leads to manual mill, manual lathe, TIG 1, ProtoMAX Waterjet, and ShopBot CNC Router. Manual mill and lathe lead to their respective CNC courses, which also require operator status. TIG 1 leads to TIG 2, MIG Welding, and Aluminum Welding. FRB Basics II covers soldering, 3D printing, and CO2 laser cutting, and leads to the R9000 Laser and Introduction to Soft Goods. Soft Goods was completed on October 29. Statuses are as of October 29, 2026.</desc>
